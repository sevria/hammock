[package]
name = "hammock"
version = "0.1.0"
edition = "2024"
description = "Express-style REST APIs for Rust"
license = "MIT"
repository = "https://github.com/sevria/hammock"
readme = "../README.md"
keywords = ["http", "web", "server", "rest", "framework"]
categories = ["web-programming::http-server"]

[dependencies]
bytes = "1.12.2"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
