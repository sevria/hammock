[package]
name = "hammock"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
